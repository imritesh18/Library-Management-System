name: Deploy Library UI to GitHub Pages
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Prepare static demo
        run: |
          mkdir -p _site
          cp web/index.html _site/index.html
          cp web/style.css _site/style.css
          cp web/script.js _site/script.js
      - name: Make Pages demo standalone
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path("_site/script.js")
          s=p.read_text()
          start=s.find("const API_BASE")
          end=s.find("\n", start)
          if start >= 0:
              s=s[:start]+'const API_BASE = "";'+s[end:]
          p.write_text(s)
          PY
      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4